<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNL FILMAKER Header</title>
  <style>
    :root{
      --bg:#000000;
      --text:#ffffff;
      --accent:#ff6b00;
      --muted:rgba(255,255,255,0.78);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow:hidden;
    }
    body{
      min-height:100vh;
    }
    .hero{
      position:relative;
      min-height:100vh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:
        radial-gradient(circle at 50% 72%, rgba(255,107,0,0.16), transparent 28%),
        radial-gradient(circle at 50% 105%, rgba(255,107,0,0.22), transparent 34%),
        linear-gradient(180deg, #000000 0%, #000000 100%);
      isolation:isolate;
    }
    .glow-wrap{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:0;
    }
    .glow,
    .glow-2,
    .glow-3{
      position:absolute;
      border-radius:50%;
      filter:blur(70px);
      opacity:0;
      transform:translate(-50%,-50%) scale(0.88);
      animation-fill-mode:forwards;
    }
    .glow{
      left:50%;
      top:76%;
      width:min(80vw,900px);
      height:min(80vw,900px);
      background:radial-gradient(circle, rgba(255,107,0,0.50) 0%, rgba(255,107,0,0.18) 30%, rgba(255,107,0,0.06) 52%, rgba(255,107,0,0) 72%);
      animation:
        glowIn 1.8s ease-out .1s forwards,
        pulse 7s ease-in-out 2s infinite alternate,
        drift 14s ease-in-out 2s infinite alternate;
    }
    .glow-2{
      left:40%;
      top:84%;
      width:min(52vw,520px);
      height:min(52vw,520px);
      background:radial-gradient(circle, rgba(255,107,0,0.28) 0%, rgba(255,107,0,0.08) 40%, rgba(255,107,0,0) 72%);
      animation:
        glowIn 2s ease-out .35s forwards,
        pulse2 8.5s ease-in-out 2.2s infinite alternate;
    }
    .glow-3{
      left:60%;
      top:84%;
      width:min(50vw,500px);
      height:min(50vw,500px);
      background:radial-gradient(circle, rgba(255,150,80,0.18) 0%, rgba(255,107,0,0.05) 48%, rgba(255,107,0,0) 74%);
      animation:
        glowIn 2.1s ease-out .5s forwards,
        pulse3 10s ease-in-out 2.5s infinite alternate;
    }
    .vignette{
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center, transparent 42%, rgba(0,0,0,0.28) 75%, rgba(0,0,0,0.58) 100%);
      z-index:1;
      pointer-events:none;
    }
    .content{
      position:relative;
      z-index:2;
      padding:40px 20px 56px;
      max-width:1200px;
      width:100%;
    }
    .eyebrow,
    .subtitle,
    .cta,
    .scroll{
      opacity:0;
      transform:translateY(16px);
      animation:fadeUp .9s ease forwards;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:0.42em;
      font-size:12px;
      margin-bottom:24px;
      animation-delay:0.85s;
    }
    .logo{
      margin:0;
      font-size:clamp(52px, 10vw, 122px);
      line-height:0.92;
      font-weight:900;
      letter-spacing:-0.05em;
      opacity:0;
      transform:translateY(20px);
      animation:logoIn 1.3s cubic-bezier(.22,.75,.18,1) .35s forwards;
      text-wrap:balance;
    }
    .logo .dot{color:var(--accent)}
    .subtitle{
      margin-top:26px;
      font-size:clamp(12px, 1.45vw, 18px);
      letter-spacing:0.38em;
      color:var(--muted);
      animation-delay:1.2s;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-top:34px;
      padding:14px 24px;
      border:1px solid rgba(255,107,0,0.85);
      color:var(--text);
      text-decoration:none;
      background:rgba(0,0,0,0.22);
      font-size:12px;
      letter-spacing:0.28em;
      transition:all .25s ease;
      animation-delay:1.55s;
    }
    .cta:hover{
      background:var(--accent);
      color:#000;
      box-shadow:0 0 30px rgba(255,107,0,0.28);
    }
    .scroll{
      position:absolute;
      left:50%;
      bottom:22px;
      transform:translateX(-50%) translateY(12px);
      animation-delay:1.9s;
      font-size:10px;
      letter-spacing:0.34em;
      color:rgba(255,255,255,0.58);
    }
    .scroll::after{
      content:"";
      display:block;
      width:1px;
      height:28px;
      background:linear-gradient(to bottom, rgba(255,107,0,0.8), rgba(255,107,0,0));
      margin:10px auto 0;
      animation:scrollGlow 1.6s ease-in-out infinite;
    }
    @keyframes logoIn{
      from{opacity:0; transform:translateY(22px) scale(0.985)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }
    @keyframes fadeUp{
      from{opacity:0; transform:translateY(16px)}
      to{opacity:1; transform:translateY(0)}
    }
    @keyframes glowIn{
      from{opacity:0; transform:translate(-50%,-50%) scale(0.82)}
      to{opacity:1; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes pulse{
      from{opacity:0.74; filter:blur(72px)}
      to{opacity:1; filter:blur(84px)}
    }
    @keyframes pulse2{
      from{opacity:0.38; filter:blur(68px)}
      to{opacity:0.62; filter:blur(78px)}
    }
    @keyframes pulse3{
      from{opacity:0.24; filter:blur(66px)}
      to{opacity:0.46; filter:blur(76px)}
    }
    @keyframes drift{
      0%{transform:translate(-50%,-50%) scale(1)}
      50%{transform:translate(-49%,-52%) scale(1.03)}
      100%{transform:translate(-51%,-49%) scale(0.99)}
    }
    @keyframes scrollGlow{
      0%,100%{opacity:.4; transform:translateY(0)}
      50%{opacity:1; transform:translateY(5px)}
    }
    @media (max-width: 768px){
      .hero{min-height:82vh}
      .eyebrow{font-size:10px; letter-spacing:0.34em; margin-bottom:18px}
      .subtitle{letter-spacing:0.24em; line-height:1.8; max-width:90%; margin-inline:auto; margin-top:22px}
      .cta{margin-top:28px; padding:13px 18px; font-size:11px; letter-spacing:0.22em}
      .scroll{bottom:16px}
      .glow{top:82%; width:100vw; height:100vw}
      .glow-2,.glow-3{top:88%; width:68vw; height:68vw}
    }
    @media (prefers-reduced-motion: reduce){
      .glow,.glow-2,.glow-3,.eyebrow,.logo,.subtitle,.cta,.scroll,.scroll::after{
        animation:none !important;
        opacity:1 !important;
        transform:none !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="glow-wrap" aria-hidden="true">
      <div class="glow"></div>
      <div class="glow-2"></div>
      <div class="glow-3"></div>
      <div class="vignette"></div>
    </div>

    <div class="content">
      <div class="eyebrow">VISUAL STORYTELLING</div>
      <h1 class="logo">DNL<span class="dot">.</span>FILMAKER</h1>
      <div class="subtitle">REGIA CINEMATOGRAFICA · FILMAKING · VIDEO EDITING</div>
      <a class="cta" href="#" onclick="return false;">WATCH SHOWREEL</a>
    </div>

    <div class="scroll">SCROLL</div>
  </section>
</body>
</html>
