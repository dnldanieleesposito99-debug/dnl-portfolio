
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DNL FILMAKER - Header</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.hero {
    position: relative;
    min-height: clamp(320px, 52vw, 580px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    isolation: isolate;
    background: #000000;
}

.glow {
    position: absolute;
    top: 65%;
    left: 50%;
    width: min(90vw, 1000px);
    height: min(65vw, 650px);

    background: radial-gradient(
        ellipse at center,
        rgba(255,107,0,.60) 0%,
        rgba(255,107,0,.24) 28%,
        rgba(255,107,0,.06) 52%,
        transparent 74%
    );

    filter: blur(55px);
    pointer-events: none;
    z-index: -1;

    animation:
        glowIn 2s ease-out both,
        glowMove 10s ease-in-out 2s infinite alternate;
}

.glow-secondary {
    position: absolute;
    top: 65%;
    left: 50%;
    width: min(70vw, 700px);
    height: min(45vw, 450px);

    background: radial-gradient(
        ellipse,
        rgba(255,130,40,.25),
        transparent 70%
    );

    filter: blur(65px);
    pointer-events: none;
    z-index: -1;

    animation:
        glowIn 2.5s ease-out both,
        glowMove 14s ease-in-out 2.5s infinite alternate-reverse;
}

.hero-content {
    position: relative;
    width: 100%;
    max-width: 1200px;
    padding: 55px 20px 85px;
}

.eyebrow {
    color: #FF6B00;
    font-size: 12px;
    letter-spacing: .42em;
    margin-bottom: 24px;

    animation: fadeUp 1s ease .8s both;
}

.logo {
    margin: 0;
    font-size: clamp(30px, 8.5vw, 110px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.05em;

    animation: logoIn 1.5s ease .4s both;
}

.logo span {
    color: #FF6B00;
}

.subtitle {
    margin-top: 26px;
    font-size: clamp(11px, 1.4vw, 17px);
    letter-spacing: .28em;
    line-height: 1.8;
    color: rgba(255,255,255,.82);

    animation: fadeUp 1s ease 1.2s both;
}

.scroll-indicator {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    font-size: 10px;
    letter-spacing: .3em;
    color: rgba(255,255,255,.55);

    animation: fadeUp 1s ease 1.8s both;
}

.scroll-indicator::after {
    content: "";
    display: block;
    width: 1px;
    height: 28px;
    margin: 12px auto 0;

    background: linear-gradient(
        to bottom,
        #FF6B00,
        transparent
    );

    animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes logoIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glowIn {
    from {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.8);
    }
    to {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1);
    }
}

@keyframes glowMove {
    from {
        opacity: .8;
        transform: translate(-53%,-50%) scale(1);
    }
    to {
        opacity: 1;
        transform: translate(-47%,-54%) scale(1.08);
    }
}

@keyframes scrollPulse {
    0%, 100% {
        opacity: .3;
        transform: translateY(0);
    }
    50% {
        opacity: 1;
        transform: translateY(6px);
    }
}

@media (max-width: 700px) {

    .hero {
        min-height: 320px;
    }

    .hero-content {
        padding: 35px 12px 55px;
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: .25em;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: .15em;
        line-height: 2;
    }

    .glow {
        width: 120vw;
        height: 100vw;
    }

    .scroll-indicator {
        bottom: 12px;
        font-size: 8px;
    }

    .scroll-indicator::after {
        height: 15px;
        margin-top: 6px;
    }
}

@media (prefers-reduced-motion: reduce) {

    * {
        animation: none !important;
    }

    .glow,
    .glow-secondary {
        transform: translate(-50%,-50%);
    }
}

</style>
</head>

<body>

<section class="hero">

    <div class="glow" aria-hidden="true"></div>
    <div class="glow-secondary" aria-hidden="true"></div>

    <div class="hero-content">

        <div class="eyebrow">
            VISUAL STORYTELLING
        </div>

        <h1 class="logo">
            DNL<span>.</span>FILMAKER
        </h1>

        <div class="subtitle">
            REGIA CINEMATOGRAFICA · FILMAKING · VIDEO EDITING
        </div>

    </div>

    <div class="scroll-indicator">
        SCROLL
    </div>

</section>

</body>
</html>
