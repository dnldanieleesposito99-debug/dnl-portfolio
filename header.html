
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DNL FILMAKER - Header & Showreel</title>

<style>

:root {
    --orange: #FF6B00;
    --black: #000000;
    --white: #FFFFFF;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000000;
    color: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =================================
   HEADER CINEMATOGRAFICO
================================= */

.hero {
    position: relative;
    min-height: min(620px, 85vw);
    padding: 45px 0 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    isolation: isolate;
    background: #000000;
}

.glow {
    position: absolute;
    top: 72%;
    left: 50%;
    width: min(85vw, 950px);
    height: min(65vw, 650px);

    background: radial-gradient(
        ellipse at center,
        rgba(255,107,0,.55) 0%,
        rgba(255,107,0,.22) 28%,
        rgba(255,107,0,.06) 52%,
        transparent 74%
    );

    filter: blur(55px);
    pointer-events: none;

    animation:
        glowIn 2s ease-out both,
        glowMove 10s ease-in-out 2s infinite alternate;

    z-index: -1;
}

.glow-secondary {
    position: absolute;
    top: 68%;
    left: 50%;
    width: min(65vw, 680px);
    height: min(45vw, 450px);

    background: radial-gradient(
        ellipse,
        rgba(255,130,40,.22),
        transparent 70%
    );

    filter: blur(65px);

    animation:
        glowIn 2.5s ease-out both,
        glowMove 14s ease-in-out 2.5s infinite alternate-reverse;

    pointer-events: none;
    z-index: -1;
}

.hero-content {
    position: relative;
    width: 100%;
    max-width: 1200px;
    padding: 40px 20px 55px;
    z-index: 2;
}

.eyebrow {
    color: var(--orange);
    font-size: 12px;
    letter-spacing: .42em;
    margin-bottom: 24px;

    animation: fadeUp 1s ease .8s both;
}

.logo {
    margin: 0;
    font-size: clamp(35px, 8.5vw, 110px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.05em;

    animation: logoIn 1.5s ease .4s both;
}

.logo span {
    color: var(--orange);
}

.subtitle {
    margin-top: 26px;
    font-size: clamp(11px, 1.4vw, 17px);
    letter-spacing: .28em;
    line-height: 1.8;
    color: rgba(255,255,255,.82);

    animation: fadeUp 1s ease 1.2s both;
}

/* PULSANTE SHOWREEL */

.cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    margin-top: 34px;
    padding: 15px 25px;

    border: 1px solid var(--orange);
    background: rgba(0,0,0,.3);

    color: white;
    text-decoration: none;

    font-size: 12px;
    letter-spacing: .25em;

    transition:
        background .3s ease,
        color .3s ease,
        box-shadow .3s ease;

    animation: fadeUp 1s ease 1.5s both;
}

.cta:hover {
    background: var(--orange);
    color: black;
    box-shadow: 0 0 30px rgba(255,107,0,.4);
}

/* INDICATORE SCROLL */

.scroll-indicator {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;

    font-size: 10px;
    letter-spacing: .3em;
    color: rgba(255,255,255,.55);

    animation: fadeUp 1s ease 1.8s both;
}

.scroll-indicator::after {
    content: "";
    display: block;

    width: 1px;
    height: 28px;

    margin: 12px auto 0;

    background: linear-gradient(
        to bottom,
        #FF6B00,
        transparent
    );

    animation: scrollPulse 2s ease-in-out infinite;
}

/* =================================
   SEZIONE SHOWREEL
================================= */

.showreel {
    position: relative;
    isolation: isolate;
    overflow: hidden;

    background: #000000;
    padding: 54px 18px 60px;

    text-align: center;
    scroll-margin-top: 12px;
}

.showreel-content {
    position: relative;
    z-index: 2;

    max-width: 1180px;
    margin: auto;
}

.kicker {
    color: var(--orange);
    font-size: 11px;
    letter-spacing: .38em;
    margin: 0 0 12px;
}

.showreel h2 {
    margin: 0;
    font-size: clamp(30px, 4.2vw, 52px);
    font-weight: 800;
    letter-spacing: .14em;
}

.orange-line {
    width: 48px;
    height: 2px;

    background: var(--orange);

    margin: 16px auto 24px;
}

.description {
    max-width: 760px;

    margin: 0 auto 28px;

    color: rgba(255,255,255,.75);

    font-size: 15px;
    line-height: 1.8;
}

/* =================================
   ONDA ARANCIONE ANIMATA
================================= */

.screen-wrap {
    position: relative;

    max-width: 1040px;
    margin: auto;
    padding: 26px 18px 22px;
}

.wave-background {
    position: absolute;

    inset: -35px -10px -35px;

    z-index: -1;
    pointer-events: none;
}

.wave-background svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.wave-one {
    transform-origin: center;

    animation:
        waveMotion 9s ease-in-out infinite alternate;
}

.wave-two {
    transform-origin: center;

    animation:
        waveMotionTwo 12s ease-in-out infinite alternate;
}

.wave-three {
    transform-origin: center;

    animation:
        waveMotion 15s ease-in-out infinite alternate-reverse;
}

/* PLAYER VIDEO */

.screen {
    position: relative;

    width: 100%;
    max-width: 1000px;

    margin: auto;

    aspect-ratio: 16 / 9;

    background: #080808;

    border: 1px solid rgba(255,255,255,.1);

    box-shadow:
        0 18px 70px rgba(0,0,0,.5),
        0 0 40px rgba(255,107,0,.12);

    overflow: hidden;
}

.screen iframe {
    display: block;
    width: 100%;
    height: 100%;

    background: #000000;
    border: 0;
}

.youtube-link {
    display: inline-block;

    margin-top: 20px;

    font-size: 12px;
    letter-spacing: .08em;

    color: #AAAAAA;
    text-decoration: none;

    transition: color .25s ease;
}

.youtube-link:hover {
    color: var(--orange);
}

/* =================================
   DISSOLVENZA DURANTE LO SCROLL
================================= */

.reveal-ready .reveal {
    opacity: 0;
    transform: translateY(28px) scale(.985);

    transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(.2,.75,.18,1);
}

.reveal-ready.revealed .reveal,
.reveal-ready:focus-within .reveal {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* =================================
   ANIMAZIONI
================================= */

@keyframes logoIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glowIn {
    from {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.8);
    }

    to {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1);
    }
}

@keyframes glowMove {
    from {
        opacity: .8;
        transform: translate(-53%,-50%) scale(1);
    }

    to {
        opacity: 1;
        transform: translate(-47%,-54%) scale(1.08);
    }
}

@keyframes scrollPulse {
    0%, 100% {
        opacity: .3;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(6px);
    }
}

@keyframes waveMotion {
    0% {
        transform: translate(-3%, 2%) rotate(-4deg);
        opacity: .65;
    }

    50% {
        transform: translate(2%, -3%) rotate(2deg);
    }

    100% {
        transform: translate(4%, 4%) rotate(5deg);
        opacity: 1;
    }
}

@keyframes waveMotionTwo {
    from {
        transform: translate(4%, -3%) rotate(3deg);
        opacity: .5;
    }

    to {
        transform: translate(-4%, 4%) rotate(-3deg);
        opacity: .9;
    }
}

/* =================================
   VERSIONE SMARTPHONE
================================= */

@media (max-width: 700px) {

    .hero {
        min-height: 350px;
        padding: 25px 0 45px;
    }

    .hero-content {
        padding: 25px 12px 40px;
    }

    .logo {
        font-size: clamp(30px, 8.5vw, 65px);
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: .25em;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: .15em;
        line-height: 2;
    }

    .cta {
        padding: 13px 18px;
        font-size: 10px;
        letter-spacing: .2em;
    }

    .scroll-indicator {
        display: none;
    }

    .glow {
        width: 120vw;
        height: 100vw;
    }

    .showreel {
        padding: 40px 12px 42px;
    }

    .description {
        font-size: 13px;
    }

    .screen-wrap {
        padding: 18px 6px 12px;
    }
}

/* ACCESSIBILITÀ */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    * {
        animation: none !important;
        transition: none !important;
    }

    .glow,
    .glow-secondary {
        transform: translate(-50%,-50%);
    }

    .reveal-ready .reveal {
        opacity: 1;
        transform: none;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<section class="hero">

    <div class="glow" aria-hidden="true"></div>
    <div class="glow-secondary" aria-hidden="true"></div>

    <div class="hero-content">

        <div class="eyebrow">
            VISUAL STORYTELLING
        </div>

        <h1 class="logo">
            DNL<span>.</span>FILMAKER
        </h1>

        <div class="subtitle">
            REGIA CINEMATOGRAFICA · FILMAKING · VIDEO EDITING
        </div>

        <a class="cta" href="#showreel">
            &#9654; WATCH SHOWREEL
        </a>

    </div>

    <div class="scroll-indicator">
        SCROLL
    </div>

</section>

<!-- SHOWREEL -->

<section class="showreel" id="showreel">

    <div class="showreel-content">

        <p class="kicker">
            DNL FILMAKER
        </p>

        <h2>SHOWREEL</h2>

        <div class="orange-line"></div>

        <p class="description">
            Una sintesi del mio sguardo, del mio ritmo
            e del mio modo di raccontare per immagini.
        </p>

        <div class="screen-wrap reveal">

            <!-- ONDE LUMINOSE -->

            <div class="wave-background" aria-hidden="true">

                <svg
                    viewBox="0 0 1200 700"
                    preserveAspectRatio="none">

                    <defs>

                        <filter id="blur-orange"
                            x="-50%" y="-50%"
                            width="200%" height="200%">

                            <feGaussianBlur stdDeviation="30"/>

                        </filter>

                        <filter id="blur-soft"
                            x="-50%" y="-50%"
                            width="200%" height="200%">

                            <feGaussianBlur stdDeviation="50"/>

                        </filter>

                    </defs>

                    <g filter="url(#blur-orange)">

                        <path
                            class="wave-one"
                            d="M -80 360
                               C 180 30, 320 680, 600 350
                               S 990 40, 1280 370"
                            fill="none"
                            stroke="#FF6B00"
                            stroke-width="65"
                            opacity=".8"/>

                        <path
                            class="wave-two"
                            d="M -80 450
                               C 160 680, 360 40, 650 430
                               S 1060 680, 1280 270"
                            fill="none"
                            stroke="#FF8533"
                            stroke-width="35"
                            opacity=".6"/>

                    </g>

                    <g filter="url(#blur-soft)">

                        <path
                            class="wave-three"
                            d="M -60 540
                               C 280 250, 400 790, 710 490
                               S 1040 250, 1260 560"
                            fill="none"
                            stroke="#FF6B00"
                            stroke-width="85"
                            opacity=".65"/>

                    </g>

                </svg>

            </div>

            <!-- VIDEO YOUTUBE -->

            <div class="screen">

                <iframe
                    src="https://www.youtube.com/embed/RPrK3lg161I?rel=0&amp;playsinline=1"
                    title="DNL FILMAKER - Showreel"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

        <a
            class="youtube-link"
            href="https://youtu.be/RPrK3lg161I"
            target="_blank"
            rel="noopener noreferrer">

            Guarda anche su YouTube &#8599;

        </a>

    </div>

</section>

<!-- ANIMAZIONE ALLO SCORRIMENTO -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const section = document.getElementById("showreel");
    const screen = section.querySelector(".screen-wrap");
    const button = document.querySelector(".cta");

    if (
        "IntersectionObserver" in window &&
        !window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches
    ) {

        section.classList.add("reveal-ready");

        const reveal = function () {

            section.classList.add("revealed");

            observer.disconnect();

        };

        const observer = new IntersectionObserver(
            function (entries) {

                entries.forEach(function (entry) {

                    if (entry.isIntersecting) {

                        reveal();

                    }

                });

            },
            {
                threshold: 0.15
            }
        );

        observer.observe(screen);

        button.addEventListener("click", function () {

            setTimeout(reveal, 900);

        });

    }

});

</script>

</body>
</html>
