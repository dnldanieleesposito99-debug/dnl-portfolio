<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>DNL FILMAKER — Selected Works</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}main{max-width:1600px;margin:auto;padding:24px 12px}.heading{text-align:center;margin-bottom:28px}.label,.role{color:#ff6b00;font-size:11px;letter-spacing:4px}h1{font-size:clamp(28px,5vw,40px);margin:12px 0 18px;letter-spacing:2px}.line{width:45px;height:3px;background:#ff6b00;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(0,1fr);gap:20px;align-items:start}.screen{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden}.screen iframe,.cover{position:absolute;inset:0;width:100%;height:100%;border:0}.cover{padding:0;cursor:pointer;background:#111;color:#ff6b00}.cover img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #ff6b00;background:#000c;border-radius:50%;width:65px;height:65px;display:grid;place-items:center;font-size:25px}.cover:hover .play{background:#ff6b00;color:#000}h2{font-size:22px;margin:16px 0 8px}aside{background:#101010;border:1px solid #252525;min-width:0}.sidehead{padding:15px;border-bottom:1px solid #292929}h3{margin:0 0 8px;font-size:14px;letter-spacing:2px}#count{font-size:12px;color:#aaa}#list{max-height:390px;overflow:auto;scrollbar-color:#ff6b00 #101010}.item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-bottom:1px solid #242424;background:transparent;color:#fff;text-align:left;cursor:pointer;font:600 13px/1.4 Arial,sans-serif}.item img{width:38%;aspect-ratio:16/9;object-fit:cover;flex-shrink:0}.item span:first-child{font-size:11px;color:#aaa}.item:hover,.item[aria-pressed=true]{background:#251509;color:#ff6b00}.item[aria-pressed=true]{box-shadow:inset 3px 0 #ff6b00}button:focus-visible{outline:2px solid #ff6b00;outline-offset:-3px}footer{text-align:center;color:#aaa;font-size:10px;letter-spacing:3px;margin:25px 0 5px}@media(max-width:750px){.layout{grid-template-columns:1fr}#list{max-height:250px}.item img{width:100px}h2{font-size:18px}}
</style></head><body><main><header class="heading"><div class="label">VIDEO PRODUCTION</div><h1>FILMAKER</h1><div class="line"></div></header><div class="layout"><section><div class="screen" id="screen"></div><h2 id="current" aria-live="polite"></h2><div class="role">FILMAKER</div></section><aside><div class="sidehead"><h3>SELECTED WORKS</h3><div id="count"></div></div><div id="list"></div></aside></div><footer>EXPLORE MY WORKS</footer></main><script>
const videos=[['iOtqp0f2d24','Tuscany Medieval Festival 2025'],['8Jrgmqym9Rw','Sara & Alessandro – Short Wedding Film'],['YMNveI_8eaQ','La nuova stella di Broadway'],['nDvFjadP-u4','Spot Sialab'],['7Gr-QgWE9l0','Associazione La Goccia – 40 anni'],['T31ytUHNigc','Como Acqua – Progetto Ceresio'],['cmLFScq8fyc','GLICINE – Valzer al vento'],['Dsigz99Xi2E','KhorakAndré – Le acciughe fanno il pallone'],['TypS7nj9igU','Croce Rossa Italiana – Lecco']];
const screen=document.getElementById('screen'),list=document.getElementById('list');const thumb=(id,q='mqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
function play(i){const [id,title]=videos[i];const f=document.createElement('iframe');f.title=title;f.referrerPolicy='strict-origin-when-cross-origin';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;screen.replaceChildren(f)}
function select(i,start=false){const [id,title]=videos[i];document.getElementById('current').textContent=title;document.getElementById('count').textContent=`${i+1} / ${videos.length} video`;Array.from(list.children).forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));if(start){play(i);return}const b=document.createElement('button');b.className='cover';b.setAttribute('aria-label','Riproduci '+title);const img=new Image();img.alt='';img.onerror=()=>{img.onerror=null;img.src=thumb(id)};img.onload=()=>{if(img.naturalWidth<=120){img.onload=null;img.src=thumb(id)}};img.src=thumb(id,'maxresdefault');const p=document.createElement('span');p.className='play';p.textContent='▶';b.append(img,p);b.onclick=()=>play(i);screen.replaceChildren(b)}
videos.forEach(([id,title],i)=>{const b=document.createElement('button');b.className='item';const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');const img=new Image();img.alt='';img.loading='lazy';img.src=thumb(id);const t=document.createElement('span');t.textContent=title;b.append(n,img,t);b.onclick=()=>select(i,true);list.append(b)});select(0);
</script></body></html>
